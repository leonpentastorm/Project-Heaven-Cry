<sc-if value="{{epOpen}}" hint-placeholder-val="{{false}}">
<div role="dialog" aria-modal="true" aria-label="{{ep.title}}" style="position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: rgba(5, 7, 11, 0.86)">
<article style="{{ep.boxStyle}}">
<div style="display: flex; align-items: flex-start; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-size: 11px; letter-spacing: 0.18em; color: #A3AEC2">{{ep.kicker}}</span>
<h2 style="{{ep.nameStyle}}">{{ep.name}}</h2>
<span style="font-size: 13px; color: #A3AEC2">{{ep.line}}</span>
</div>
<button type="button" onClick="{{closeEpccg}}" aria-label="Close the EPCCG entry" style="margin-left: auto; flex: none; min-height: 40px; padding: 0 14px; border-radius: 9px; border: 1px solid #2E3A50; background: transparent; color: #E7EBF3; font-family: inherit; font-weight: 600; cursor: pointer">Close ✕</button>
</div>
<div style="display: flex; gap: 24px; flex-wrap: wrap">
<figure style="margin: 0; flex: 0 0 240px; display: flex; flex-direction: column; gap: 8px">
<button type="button" onClick="{{ep.zoom}}" aria-label="Enlarge {{ep.pictured}}" style="{{zoomBtn}}"><img src="{{ep.img}}" alt="{{ep.alt}}" style="width: 240px; height: 300px; object-fit: cover; border-radius: 10px; background: #000; border: 1px solid #232D3F"></button>
<figcaption style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 700">{{ep.pictured}}</span>
<span style="font-size: 12px; line-height: 1.4; color: #A3AEC2">{{ep.caption}}</span>
</figcaption>
</figure>
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<blockquote style="{{ep.quoteStyle}}">
<sc-for list="{{ep.quote}}" as="q" hint-placeholder-count="2"><p style="{{q.style}}">{{q.text}}</p></sc-for>
<footer style="font-size: 13px; color: #A3AEC2">{{ep.speaker}}</footer>
</blockquote>
<p style="margin: 0; font-family: 'Spectral', serif; font-size: 16px; line-height: 1.6; color: #E7EBF3">{{ep.intro}}</p>
<dl style="margin: 0; display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px 14px; font-size: 14px; line-height: 1.45">
<sc-for list="{{ep.rows}}" as="r" hint-placeholder-count="4"><dt style="font-size: 11px; letter-spacing: 0.14em; color: #A3AEC2; padding-top: 3px">{{r.k}}</dt><dd style="margin: 0; color: #DCE2EC">{{r.v}}</dd></sc-for>
</dl>
</div>
</div>
<section aria-label="Perks" style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #232D3F; padding-top: 16px">
<span style="font-size: 11px; letter-spacing: 0.16em; color: #A3AEC2">{{ep.perkHead}}</span>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px">
<sc-for list="{{ep.perks}}" as="p" hint-placeholder-count="2"><div style="display: flex; gap: 14px; align-items: flex-start; padding: 14px; border-radius: 12px; background: #0A0D13; border: 1px solid #232D3F">
<sc-if value="{{p.has}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{p.zoom}}" aria-label="Enlarge {{p.name}}" style="{{zoomBtn}}"><img class="phc-icon" src="{{p.icon}}" alt="{{p.alt}}" style="width: 64px; height: 64px; flex: none; border-radius: 10px; background: #10151F; border: 1px solid #232D3F"></button></sc-if>
<sc-if value="{{p.none}}" hint-placeholder-val="{{false}}"><div aria-label="Icon not drawn yet" style="width: 64px; height: 64px; flex: none; box-sizing: border-box; border-radius: 10px; border: 1px dashed #3B475D; display: grid; place-items: center; font-size: 10px; letter-spacing: 0.1em; color: #7F8BA1">ICON<br>SOON</div></sc-if>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="{{ep.perkNameStyle}}">{{p.name}}</span>
<span style="font-size: 11px; letter-spacing: 0.12em; color: #A3AEC2">{{p.meta}}</span>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 1.45; color: #DCE2EC"><b style="color: #E7EBF3">I</b> · {{p.t1}}</p>
<p style="margin: 0; font-size: 13px; line-height: 1.45; color: #A3AEC2"><b style="color: #E7EBF3">II</b> · {{p.t2}} <span style="color: #7F8BA1">(at Mastery 3, 7 points)</span></p>
</div>
</div></sc-for>
</div>
</section>
</article>
</div>
</sc-if>
