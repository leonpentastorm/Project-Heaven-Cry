<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Hellraiser service rifle. Monoline icon: one outline for the silhouette, a few interior lines; 64 grid, 2-unit
       stroke, gaps never narrower than the stroke. -->
  <g transform="translate(0 4) rotate(-16 32 32)">
    <!-- the silhouette: stock, rail, receiver, handguard, barrel, brake, magazine, grip -->
    <path d="M2.5 24.5 L17 22.5 L17 19.5 L35 19.5 L35 21.5 L46 21.5 L48 23.5 L55 23.5 L55 21.5 L60.5 21.5 L60.5 29.5
             L55 29.5 L55 27.5 L48 27.5 L45 30.5 L35 30.5 L36 42 L30.5 42.5 L29 30.5 L24 30.5 L22.5 39.5 L17.5 39 L19 30.5
             L17 30.5 L5 36.5 L2.5 35.5 Z"/>
    <!-- stock cutout and two trench spikes -->
    <path d="M7 27.5 L13.5 26.8 L8 31 Z"/>
    <path d="M6 24 L7.5 20.5 L9 23.6 M10.5 23.4 L12 20 L13.5 23"/>
    <!-- receiver: ejection port; trigger -->
    <path d="M21 25 L29 25"/>
    <path d="M24 30.5 L24 34 L28 34"/>
    <!-- handguard vents, front sight, brake port -->
    <path d="M39.5 24.5 L39 27.5 M43 24.5 L42.5 27.5"/>
    <path d="M50.5 23.5 L50.5 18.5"/>
    <path d="M57.8 21.5 L57.8 29.5"/>
    <!-- bayonet -->
    <path d="M48.5 32.5 L55 32.5 L62.5 34 L55 35.5 L48.5 35.5"/>
  </g>
</svg>
