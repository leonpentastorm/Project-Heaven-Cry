<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Lumeri censer gun. Monoline icon: one outline for the silhouette, a few interior lines; 64 grid, 2-unit stroke. -->
  <g transform="translate(0 4) rotate(-16 32 32)">
    <!-- the silhouette: spiked butt, carved stock, receiver, barrel over the magazine tube, grip -->
    <path d="M4 25.5 Q10 24 17 23 L17 20.5 L29 20.5 L29 22 L43.5 22 L43.5 30.5 L29 30.5 L22 30.5 L20.5 39 L16.5 38.5
             L18 30.5 L17 30.5 Q10 32.5 4 34.5 Z"/>
    <path d="M4 27.5 L0.5 30 L4 32.5"/>
    <!-- lancet window on the receiver; the tube line; a brass band; the trigger -->
    <path d="M23 27.5 L23 25.5 Q23 23.6 25 23 Q27 23.6 27 25.5 L27 27.5 Z"/>
    <path d="M29 26.5 L43.5 26.5"/>
    <path d="M36.5 22 L36.5 30.5"/>
    <path d="M22 30.5 L22 34 L26 34"/>
    <!-- prayer beads and the sun medallion -->
    <path d="M11 33.5 L11.4 34.8 M11.9 37 L12.3 38.3"/>
    <circle cx="13.2" cy="41.8" r="2.1"/>
    <!-- the censer: caged orb, spire, spear tip -->
    <circle cx="50" cy="26" r="6.5"/>
    <path d="M50 19.5 L50 32.5 M43.5 26 L56.5 26"/>
    <path d="M48 19.8 L50 15 L52 19.8"/>
    <path d="M56.5 26 L63 26"/>
  </g>
  <!-- incense rising, upright -->
  <path d="M52 13 Q50 10.5 52 8 Q54 5.5 52 3.5"/>
  <path d="M57.5 14.5 Q55.5 12 57.5 9.5"/>
</svg>
