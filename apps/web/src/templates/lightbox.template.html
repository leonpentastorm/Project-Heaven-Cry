<sc-if value="{{lbOpen}}" hint-placeholder-val="{{false}}">
<div role="dialog" aria-modal="true" aria-label="{{lb.caption}}" style="position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; background: rgba(5, 7, 11, 0.94)">
<img src="{{lb.img}}" alt="{{lb.caption}}" style="{{lb.imgStyle}}">
<div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center">
<span style="font-family: 'Spectral', serif; font-size: 18px; color: #E7EBF3">{{lb.caption}}</span>
<span style="font-size: 12px; letter-spacing: 0.12em; color: #A3AEC2">{{lb.kind}}</span>
<button type="button" onClick="{{closeLb}}" aria-label="Close the enlarged image" style="min-height: 40px; padding: 0 16px; border-radius: 9px; border: 1px solid #2E3A50; background: #10151F; color: #E7EBF3; font-family: inherit; font-weight: 600; cursor: pointer">Close ✕</button>
</div>
</div>
</sc-if>
