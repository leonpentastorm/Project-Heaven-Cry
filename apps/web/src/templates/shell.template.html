<div class="phc-shell" style="flex: none; display: flex; align-items: center; gap: 8px">
<sc-if value="{{sh.showBack}}" hint-placeholder-val="{{false}}"><button type="button" data-phc-back-session="" onClick="{{sh.toSession}}" style="min-height: 34px; padding: 0 14px; border-radius: 8px; border: 0; background: #6FEA77; color: #0A0D13; font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer; white-space: nowrap">Back to the session ›</button></sc-if>
<sc-if value="{{sh.showRoom}}" hint-placeholder-val="{{true}}"><button type="button" data-phc-room="" onClick="{{sh.toRoom}}" aria-label="Room {{sh.code}}: players, the Narrator's key and model, the invite" title="The room: players, the Narrator's key and model, the invite link" style="min-height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid #2E3A50; background: transparent; color: #E7EBF3; font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; cursor: pointer; white-space: nowrap">ROOM {{sh.code}} ›</button></sc-if>
<sc-if value="{{sh.isHost}}" hint-placeholder-val="{{true}}"><button type="button" data-phc-save="" onClick="{{sh.save}}" title="{{sh.saveTitle}}" aria-label="{{sh.saveName}}" style="{{sh.saveStyle}}">{{sh.saveLabel}}</button></sc-if>
<button type="button" data-phc-cog="" onClick="{{sh.settings}}" aria-label="Settings" title="Settings: sound mix, the Narrator's voice, combat speed, display" style="display: grid; place-items: center; width: 36px; min-height: 34px; padding: 0; border-radius: 8px; border: 1px solid #2E3A50; background: transparent; color: #E7EBF3; font-family: inherit; font-size: 17px; line-height: 1; cursor: pointer">⚙</button>
<button type="button" data-phc-report="" onClick="{{sh.report}}" aria-label="⚑ Report a problem" title="Something broke? Download a report to send to Leon." style="display: grid; place-items: center; width: 36px; min-height: 34px; padding: 0; border-radius: 8px; border: 1px solid #2E3A50; background: transparent; color: #A3AEC2; font-family: inherit; font-size: 15px; line-height: 1; cursor: pointer">⚑</button>
<button type="button" data-phc-leave="" onClick="{{sh.leave}}" aria-label="{{sh.leaveName}}" title="{{sh.leaveTitle}}" style="min-height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid #2E3A50; background: transparent; color: #E7EBF3; font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; cursor: pointer; white-space: nowrap">Leave</button>
</div>
